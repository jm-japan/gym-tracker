<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <title>Gym Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Each screen is drawn into #app by app.js -->
  <main id="app"></main>

  <!-- Rest timer bar (shown when a timer is running) -->
  <div id="timerbar" hidden>
    <div class="t-fill"></div>
    <span class="t-label">Rest</span>
    <span class="t-time">2:00</span>
    <button data-act="timerAdd" data-d="-15">−15</button>
    <button data-act="timerAdd" data-d="15">+15</button>
    <button data-act="timerStop" aria-label="Stop timer">✕</button>
  </div>

  <div id="toast" hidden></div>

  <nav id="nav">
    <button data-act="nav" data-v="home"><span>🏋️</span>Train</button>
    <button data-act="nav" data-v="history"><span>📅</span>History</button>
    <button data-act="nav" data-v="maxes"><span>🎯</span>Maxes</button>
    <button data-act="nav" data-v="program"><span>📝</span>Program</button>
    <button data-act="nav" data-v="data"><span>⚙️</span>Data</button>
  </nav>

  <input type="file" id="importInput" accept=".json,application/json" hidden>

  <script src="db.js"></script>
  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
